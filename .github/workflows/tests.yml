# Offline test suite on GitHub-hosted runners (no network, no HPC data).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          locked: true
      - run: pixi run test
      - name: Site JS syntax
        run: node --check docs/app.js
